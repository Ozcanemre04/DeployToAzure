name: Publish

on: 
  workflow_dispatch:
  push:
   branches:
    - main
 

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v3
    
     - name: Setup .Net
       uses: actions/setup-dotnet@v3
       with:
         dotnet-version: '8.0.x'

     - name: Restore
       run: dotnet restore ./DeployToAzure.sln

     - name: Build
       run: dotnet build ./DeployToAzure.sln --no-restore --configuration Release

     - name: Test
       run: dotnet test ./DeployToAzure.sln --no-build --configuration Release

     - name: Publish
       run: dotnet publish ./DeployToAzure.sln --no-build --configuration Release --output '${{secrets.AZURE_PUBLISH_PROFILE}}'
       
     - name: Deployement
       uses: azure/webapps-deploy@v2
       with:
         app-name: DeployLearning
         publish-profile: ${{secrets.AZURE_PUBLISH_PROFILE}}
         package: ./publish
     
