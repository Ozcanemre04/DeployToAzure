name: Publish

on: 
  workflow_dispatch:
  push:
   branches:
    - main
 

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v3
    
     - name: Setup .Net
       uses: actions/setup-dotnet@v3
       with:
         dotnet-version: '8.0.x'

     - name: Restore
       uses: dotnet restore ./DeployToAzure.sln

     - name: Build
       uses: dotnet build ./DeployToAzure.sln --no-restore --configuration Release

     - name: Test
       uses: dotnet test ./DeployToAzure.sln --no-build --configuration Release

     - name: Publish
       uses: dotnet publish ./DeployToAzure.sln --no-build --configuration Release
